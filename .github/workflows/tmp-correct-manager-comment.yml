name: Temporary correct manager optimisation comment

on:
  push:
    branches:
      - feature/local-patchset-parity-r2
    paths:
      - ".github/workflows/tmp-correct-manager-comment.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/local-patchset-parity-r2
          fetch-depth: 0

      - name: Correct optimisation comment and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/models/manager.py")
          source = path.read_text()
          old = '''            # _aggregate_item_data only reads scalar history fields from these\n            # duplicate rows; item metadata comes from the displayed media row.\n            # This intentionally skips both the Item join and _apply_prefetch_related:\n            # the events/tags/seasons/episodes\n'''
          new = '''            # _aggregate_item_data only reads scalar history fields from these\n            # duplicate rows; item metadata comes from the displayed media row.\n            # Do not select_related Item here: default model ordering may still\n            # require an SQL join, but hydrating Item columns for every duplicate\n            # row is unnecessary. _apply_prefetch_related is also intentionally\n            # skipped: the events/tags/seasons/episodes\n'''
          if source.count(old) != 1:
              raise SystemExit("Expected optimisation comment exactly once")
          path.write_text(source.replace(old, new, 1))
          PY
          rm .github/workflows/tmp-correct-manager-comment.yml
          git diff --check

      - name: Commit correction
        run: |
          git config user.name "ghub-priv"
          git config user.email "ghub-priv@users.noreply.github.com"
          git add -A
          git commit -m "Clarify duplicate aggregation optimisation"
          git push origin HEAD:feature/local-patchset-parity-r2
