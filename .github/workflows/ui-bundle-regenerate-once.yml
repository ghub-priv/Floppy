name: One-shot UI bundle regeneration
on:
  push:
    branches:
      - automation/ui-bundle-regeneration-20261103
permissions:
  contents: write
jobs:
  regenerate:
    if: "github.event.head_commit.message != 'build(ui): regenerate temporary assets'"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout pinned branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Install locked frontend dependencies without scripts
        run: npm ci --ignore-scripts
      - name: Regenerate and verify UI assets
        run: |
          npm run build:ui
          npm run check:ui
      - name: Commit generated assets to temporary branch only
        run: |
          set -euo pipefail
          git add -A -- src/static/ui
          if git diff --cached --quiet; then
            echo 'UI assets already match frontend sources'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(ui): regenerate temporary assets'
          git push origin HEAD:refs/heads/automation/ui-bundle-regeneration-20261103
