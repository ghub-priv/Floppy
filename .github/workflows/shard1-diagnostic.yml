name: Shard 1 Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shard1-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shard1-diagnostic:
    name: shard 1 serial diagnostic
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/local-patchset-parity-r2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Install test dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Install Playwright Chromium
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Set test environment
        run: |
          if [ -n "${{ secrets.SECRET }}" ]; then echo "SECRET=${{ secrets.SECRET }}" >> "$GITHUB_ENV"; fi
          if [ -z "${{ secrets.SECRET }}" ]; then
            echo "SECRET=$(uv run --no-sync python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.TMDB_API }}" ]; then echo "TMDB_API=${{ secrets.TMDB_API }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ secrets.MAL_API }}" ]; then echo "MAL_API=${{ secrets.MAL_API }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ secrets.IGDB_ID }}" ]; then echo "IGDB_ID=${{ secrets.IGDB_ID }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ secrets.IGDB_SECRET }}" ]; then echo "IGDB_SECRET=${{ secrets.IGDB_SECRET }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ secrets.HARDCOVER_API }}" ]; then echo "HARDCOVER_API=${{ secrets.HARDCOVER_API }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ secrets.COMICVINE_API }}" ]; then echo "COMICVINE_API=${{ secrets.COMICVINE_API }}" >> "$GITHUB_ENV"; fi

      - name: Rebuild shard 1 assignment
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path

          shard = 1
          shard_count = 4
          roots = ("app", "users", "integrations", "lists", "events", "api", "config")

          def module_name(path: Path) -> str:
              return ".".join(path.with_suffix("").parts[1:])

          files: set[Path] = set()
          for root in roots:
              app_root = Path("src") / root
              tests_file = app_root / "tests.py"
              if tests_file.exists():
                  files.add(tests_file)
              tests_dir = app_root / "tests"
              if tests_dir.exists():
                  files.update(
                      path
                      for path in tests_dir.rglob("test*.py")
                      if path.name != "__init__.py"
                  )

          bins: list[list[Path]] = [[] for _ in range(shard_count)]
          weights = [0] * shard_count
          for path in sorted(files, key=lambda item: (-item.stat().st_size, str(item))):
              target = min(range(shard_count), key=lambda index: weights[index])
              bins[target].append(path)
              weights[target] += path.stat().st_size

          selected = sorted(module_name(path) for path in bins[shard])
          with Path("full-tests.txt").open("w") as handle:
              for test in selected:
                  handle.write(f"{test}\n")

          print(
              f"Shard {shard}/{shard_count - 1}: {len(selected)} modules, "
              f"approx. {weights[shard] / 1024:.0f} KiB of test source"
          )
          print("Shard 1 modules:")
          for test in selected:
              print(f"  {test}")
          PY

      - name: Run shard 1 serially with diagnostics
        run: |
          mapfile -t TESTS < full-tests.txt
          cd src
          ../.venv/bin/python -X faulthandler -c '
          import faulthandler
          import runpy

          faulthandler.dump_traceback_later(600, repeat=True)
          runpy.run_path("manage.py", run_name="__main__")
          ' test "${TESTS[@]}" --parallel 1 --verbosity 2 --exclude-tag network
