name: Scoped token Ruff fix

on:
  push:
    branches:
      - feature/scoped-integration-tokens-v1.0.1
    paths:
      - .github/workflows/scoped-token-ruff-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/scoped-integration-tokens-v1.0.1
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.3"
      - run: uv sync --locked --only-group lint
      - name: Apply Ruff fixes
        run: |
          uv run --no-sync ruff check --fix src/api/integration_scopes.py src/users/integration_token_views.py
          uv run --no-sync ruff format src/api/integration_scopes.py src/users/integration_token_views.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api/integration_scopes.py src/users/integration_token_views.py
          if ! git diff --cached --quiet; then
            git commit -m "Format scoped token Python modules"
            git push origin HEAD:feature/scoped-integration-tokens-v1.0.1
          fi
