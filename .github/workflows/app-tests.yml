name: App Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - ".github/workflows/**"
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - chris/integration
      - latest
      - release
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: quick changed tests
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Install test dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Set test environment
        run: |
          if [ -n "${{ secrets.SECRET }}" ]; then echo "SECRET=${{ secrets.SECRET }}" >> "$GITHUB_ENV"; fi
          if [ -z "${{ secrets.SECRET }}" ]; then
            echo "SECRET=$(uv run --no-sync python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.TMDB_API }}" ]; then echo "TMDB_API=${{ secrets.TMDB_API }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ secrets.MAL_API }}" ]; then echo "MAL_API=${{ secrets.MAL_API }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ secrets.IGDB_ID }}" ]; then echo "IGDB_ID=${{ secrets.IGDB_ID }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ secrets.IGDB_SECRET }}" ]; then echo "IGDB_SECRET=${{ secrets.IGDB_SECRET }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ secrets.HARDCOVER_API }}" ]; then echo "HARDCOVER_API=${{ secrets.HARDCOVER_API }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ secrets.COMICVINE_API }}" ]; then echo "COMICVINE_API=${{ secrets.COMICVINE_API }}" >> "$GITHUB_ENV"; fi

      - name: Django startup check
        run: uv run --no-sync python src/manage.py check

      - name: Select targeted tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          changed = subprocess.run(
              ["git", "diff", "--name-only", f"{base}...{head}", "--", "src"],
              capture_output=True,
              text=True,
              check=True,
          ).stdout.splitlines()

          def module_name(path: Path) -> str:
              return ".".join(path.with_suffix("").parts[1:])

          tests: set[str] = set()
          source_stems: set[str] = set()

          for raw in changed:
              path = Path(raw)
              if path.suffix != ".py":
                  continue
              # A PR diff includes deleted/renamed-away test paths. Never pass
              # those stale module names to Django's loader.
              if not path.exists():
                  continue
              if "tests" in path.parts or path.name == "tests.py":
                  if path.name != "__init__.py":
                      tests.add(module_name(path))
              elif "migrations" not in path.parts:
                  source_stems.add(path.stem.lower())

          # Also pick existing tests whose filename names a changed source module.
          for root in ("app", "users", "integrations", "lists", "events", "api", "config"):
              app_root = Path("src") / root
              candidates = []
              tests_file = app_root / "tests.py"
              if tests_file.exists():
                  candidates.append(tests_file)
              tests_dir = app_root / "tests"
              if tests_dir.exists():
                  candidates.extend(tests_dir.rglob("test*.py"))
              for candidate in candidates:
                  stem = candidate.stem.lower()
                  if any(source_stem in stem for source_stem in source_stems):
                      tests.add(module_name(candidate))

          browser_tests: list[str] = []
          parallel_tests: list[str] = []
          for test in sorted(tests):
              path = Path("src", *test.split(".")).with_suffix(".py")
              source = path.read_text(encoding="utf-8") if path.exists() else ""
              if "playwright" in source.lower():
                  browser_tests.append(test)
              else:
                  parallel_tests.append(test)

          for filename, selected in (
              ("quick-tests.txt", sorted(tests)),
              ("quick-parallel-tests.txt", parallel_tests),
              ("quick-browser-tests.txt", browser_tests),
          ):
              with Path(filename).open("w") as handle:
                  for test in selected:
                      handle.write(f"{test}\n")

          print(f"Selected {len(tests)} targeted test module(s).")
          print(f"  parallel: {len(parallel_tests)}")
          print(f"  browser/serial: {len(browser_tests)}")
          for test in sorted(tests):
              print(f"  {test}")
          PY

      - name: Install Playwright Chromium when needed
        run: |
          if [ -s quick-browser-tests.txt ]; then
            uv run --no-sync playwright install --with-deps chromium
          else
            echo "No selected Playwright modules; browser install not required."
          fi

      - name: Run targeted parallel tests
        run: |
          if [ ! -s quick-parallel-tests.txt ]; then
            echo "No parallel-safe targeted Django test modules selected."
            exit 0
          fi
          mapfile -t TESTS < quick-parallel-tests.txt
          uv run --no-sync python src/manage.py test "${TESTS[@]}" --parallel --exclude-tag network

      - name: Run targeted browser tests serially
        run: |
          if [ ! -s quick-browser-tests.txt ]; then
            echo "No targeted Playwright test modules selected."
            exit 0
          fi
          mapfile -t TESTS < quick-browser-tests.txt
          uv run --no-sync python src/manage.py test "${TESTS[@]}" --parallel 1 --exclude-tag network

  full:
    name: full shard ${{ matrix.shard }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Install test dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Install Playwright Chromium
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Set test environment
        run: |
          if [ -n "${{ secrets.SECRET }}" ]; then echo "SECRET=${{ secrets.SECRET }}" >> "$GITHUB_ENV"; fi
          if [ -z "${{ secrets.SECRET }}" ]; then
            echo "SECRET=$(uv run --no-sync python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.TMDB_API }}" ]; then echo "TMDB_API=${{ secrets.TMDB_API }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ secrets.MAL_API }}" ]; then echo "MAL_API=${{ secrets.MAL_API }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ secrets.IGDB_ID }}" ]; then echo "IGDB_ID=${{ secrets.IGDB_ID }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ secrets.IGDB_SECRET }}" ]; then echo "IGDB_SECRET=${{ secrets.IGDB_SECRET }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ secrets.HARDCOVER_API }}" ]; then echo "HARDCOVER_API=${{ secrets.HARDCOVER_API }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ secrets.COMICVINE_API }}" ]; then echo "COMICVINE_API=${{ secrets.COMICVINE_API }}" >> "$GITHUB_ENV"; fi

      - name: Build balanced test shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: 4
        run: |
          uv run --no-sync python - <<'PY'
          import os
          from pathlib import Path

          shard = int(os.environ["SHARD"])
          shard_count = int(os.environ["SHARD_COUNT"])
          roots = ("app", "users", "integrations", "lists", "events", "api", "config")

          def module_name(path: Path) -> str:
              return ".".join(path.with_suffix("").parts[1:])

          files: set[Path] = set()
          for root in roots:
              app_root = Path("src") / root
              tests_file = app_root / "tests.py"
              if tests_file.exists():
                  files.add(tests_file)
              tests_dir = app_root / "tests"
              if tests_dir.exists():
                  files.update(
                      path
                      for path in tests_dir.rglob("test*.py")
                      if path.name != "__init__.py"
                  )

          # Greedy size balancing is deterministic and avoids one huge app shard.
          bins: list[list[Path]] = [[] for _ in range(shard_count)]
          weights = [0] * shard_count
          for path in sorted(files, key=lambda item: (-item.stat().st_size, str(item))):
              target = min(range(shard_count), key=lambda index: weights[index])
              bins[target].append(path)
              weights[target] += path.stat().st_size

          selected = sorted(module_name(path) for path in bins[shard])
          with Path("full-tests.txt").open("w") as handle:
              for test in selected:
                  handle.write(f"{test}\n")

          print(
              f"Shard {shard}/{shard_count - 1}: {len(selected)} modules, "
              f"approx. {weights[shard] / 1024:.0f} KiB of test source"
          )
          PY

      - name: Run full regression shard
        env:
          WITH_COVERAGE: ${{ github.event_name == 'push' }}
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t TESTS < full-tests.txt
          if [ "$SHARD" = "1" ]; then
            PARALLEL_ARGS=(--parallel 1)
          else
            PARALLEL_ARGS=(--parallel)
          fi

          if [ "$WITH_COVERAGE" = "true" ]; then
            uv run --no-sync coverage run src/manage.py test "${TESTS[@]}" "${PARALLEL_ARGS[@]}" --exclude-tag network
          else
            uv run --no-sync python src/manage.py test "${TESTS[@]}" "${PARALLEL_ARGS[@]}" --exclude-tag network
          fi

      - name: Build coverage report
        if: github.event_name == 'push'
        run: |
          uv run --no-sync coverage combine
          uv run --no-sync coverage xml -o "coverage-${{ matrix.shard }}.xml"

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-${{ matrix.shard }}.xml
          flags: app-tests-shard-${{ matrix.shard }}
          fail_ci_if_error: false
