name: Temporary apply local manager optimisation

on:
  push:
    branches:
      - feature/local-patchset-parity-r2
    paths:
      - ".github/workflows/tmp-apply-local-manager-optimisation.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/local-patchset-parity-r2
          fetch-depth: 0

      - name: Apply verified source-native optimisation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/models/manager.py")
          source = path.read_text()

          old_comment = '''            # _aggregate_item_data only reads scalar fields (progress, status, dates,\n            # score) and item.media_type off these entries, so this intentionally\n            # skips _apply_prefetch_related: the events/tags/seasons/episodes\n'''
          new_comment = '''            # _aggregate_item_data only reads scalar history fields from these\n            # duplicate rows; item metadata comes from the displayed media row.\n            # This intentionally skips both the Item join and _apply_prefetch_related:\n            # the events/tags/seasons/episodes\n'''
          old_query = '''            all_media = model.objects.filter(\n                user=user.id,\n                item_id__in=queried_item_ids,\n            ).select_related("item")\n'''
          new_query = '''            all_media = model.objects.filter(\n                user=user.id,\n                item_id__in=queried_item_ids,\n            )\n'''

          if source.count(old_comment) != 1:
              raise SystemExit("Expected aggregation comment exactly once; refusing to edit")
          if source.count(old_query) != 1:
              raise SystemExit("Expected duplicate-history query exactly once; refusing to edit")

          source = source.replace(old_comment, new_comment, 1)
          source = source.replace(old_query, new_query, 1)
          path.write_text(source)
          PY

          git diff --check
          git diff -- src/app/models/manager.py

      - name: Commit optimisation
        run: |
          if git diff --quiet -- src/app/models/manager.py; then
            echo "No manager change to commit."
            exit 0
          fi
          git config user.name "ghub-priv"
          git config user.email "ghub-priv@users.noreply.github.com"
          git add src/app/models/manager.py
          git commit -m "Restore duplicate aggregation performance optimisation"
          git push origin HEAD:feature/local-patchset-parity-r2
