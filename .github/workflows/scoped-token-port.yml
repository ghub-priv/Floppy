name: Scoped token port cleanup

on:
  push:
    branches:
      - feature/scoped-integration-tokens-v1.0.1
    paths:
      - .github/workflows/scoped-token-port.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/scoped-integration-tokens-v1.0.1
          fetch-depth: 0
      - name: Remove superseded integrations-page injection
        run: |
          python - <<'PY'
          from pathlib import Path

          template = Path("src/templates/users/integrations.html")
          text = template.read_text()
          text = text.replace("{% load integration_token_tags %}\n", "", 1)
          text = text.replace("    {% integration_token_panel request.user %}\n\n", "", 1)
          template.write_text(text)
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/templates/users/integrations.html
          if ! git diff --cached --quiet; then
            git commit -m "Keep scoped tokens on dedicated settings subpage"
            git push origin HEAD:feature/scoped-integration-tokens-v1.0.1
          fi
