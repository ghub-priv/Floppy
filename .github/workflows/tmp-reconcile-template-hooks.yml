name: Temporary reconcile template hooks

on:
  push:
    branches:
      - sync/upstream-2026-09-10

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sync/upstream-2026-09-10
          fetch-depth: 0

      - name: Restore reconciled template hooks
        run: |
          python - <<'PY'
          from pathlib import Path

          detail = Path("src/templates/app/components/detail_action_buttons.html")
          text = detail.read_text(encoding="utf-8")
          marker = "          {# Keep the hero tracker action full-width on mobile so the split button cannot collapse to content width after flex/layout merges. #}"
          kodi_hook = '''          {# Kodi Control + Sync v2.7: preserve the accepted r13 action order while reusing a shared component. #}
          {% if media.source == Sources.TMDB.value %}
            {% if media_type == MediaTypes.SEASON.value %}
              {% include "app/components/kodi_play_action.html" with kodi_form_id="kodi-play-form" kodi_status_id="kodi-play-status" kodi_source=media.source kodi_media_type=media_type kodi_media_id=media.media_id kodi_include_season=1 kodi_season_number=media.season_number %}
            {% elif media_type == MediaTypes.MOVIE.value or media_type == MediaTypes.TV.value %}
              {% include "app/components/kodi_play_action.html" with kodi_form_id="kodi-play-form" kodi_status_id="kodi-play-status" kodi_source=media.source kodi_media_type=media_type kodi_media_id=media.media_id %}
            {% endif %}
          {% endif %}
'''
          if 'app/components/kodi_play_action.html' not in text:
              if text.count(marker) != 1:
                  raise SystemExit(f"detail action marker count is {text.count(marker)}, expected 1")
              text = text.replace(marker, kodi_hook + marker, 1)
              detail.write_text(text, encoding="utf-8")

          history = Path("src/templates/app/components/history_card.html")
          text = history.read_text(encoding="utf-8")
          static_score = '''      {% if entry.score|show_media_score:user %}
        <span class="flex items-center gap-1 text-xs text-yellow-300 shrink-0">
          {% include "app/icons/star.svg" with classes="w-3 h-3 text-yellow-400 fill-current" %}
          <span class="font-medium">{{ entry.score|score_display:user }}</span>
        </span>
      {% endif %}'''
          quick_rating = '''      {# quick_rating_overlay_v4_history_shared_component #}
      {% include "app/components/media_card_rating.html" with quick_rating_media_type=entry.media_type quick_rating_instance_id=entry.instance_id quick_rating_value=entry.score history_mode=history_mode %}'''
          if "quick_rating_overlay_v4_history_shared_component" not in text:
              if text.count(static_score) != 1:
                  raise SystemExit(f"history score block count is {text.count(static_score)}, expected 1")
              text = text.replace(static_score, quick_rating, 1)
              history.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/templates/app/components/detail_action_buttons.html src/templates/app/components/history_card.html
          if git diff --cached --quiet; then
            echo "Template hooks already reconciled."
            exit 0
          fi
          git commit -m "Restore Kodi and quick-rating template hooks after upstream merge"
          git push origin HEAD:sync/upstream-2026-09-10
